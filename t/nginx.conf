worker_processes 1;
daemon off;
error_log logs/error.log info;
pid logs/nginx.pid;

load_module modules/ngx_http_lscache_module.so;

events {
    worker_connections 64;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/access.log;

    # Cache root. Created by the Dockerfile RUN step; the worker user
    # owns it.
    lscache_path     /var/cache/nginx/lscache;
    lscache_max_size 100m;

    # Default purge ACL is 127.0.0.1 + ::1, but we restate it so the
    # behavior is obvious from the conf.
    lscache_purge_allowed 127.0.0.1 ::1;

    # ───────────────────────────────────────────────────────────────────
    # Internal "backend" - simulates a PHP-FPM upstream that emits the
    # X-LiteSpeed-* protocol headers. The outer server reaches it via
    # proxy_pass so the headers arrive in r->headers_out at filter time
    # (add_header runs at filter time too, but it's the inner server's
    # filter so by the time the outer server's filter chain runs, those
    # headers are part of the upstream response).
    # ───────────────────────────────────────────────────────────────────
    server {
        listen 127.0.0.1:8189;
        server_name backend;

        root __HTDOCS_ROOT__;

        location /cached/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=60" always;
        }

        location /short/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=2" always;
        }

        location /no-cache/ {
            add_header X-LiteSpeed-Cache-Control "no-cache" always;
        }

        location /uncontrolled/ {
            # no X-LiteSpeed-Cache-Control at all
        }

        location /tagged/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=120" always;
            add_header X-LiteSpeed-Tag           "home,sidebar"        always;
        }

        location /vary/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=60"   always;
            add_header X-LiteSpeed-Vary          "cookie=wp_logged_in" always;
        }

        location /private/ {
            add_header X-LiteSpeed-Cache-Control "private,max-age=60" always;
        }

        location /set-cookie/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=60" always;
            add_header Set-Cookie                "session=abc"        always;
        }

        location /lsc-cookie/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=60" always;
            add_header LSC-Cookie                "lsc_flag=1; Path=/" always;
        }

        location /inline-purge/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=60" always;
            add_header X-LiteSpeed-Purge         "tag=home"          always;
        }

        location /vary-other/ {
            # RFC 7234 Vary on anything beyond Accept-Encoding -> we must refuse.
            add_header X-LiteSpeed-Cache-Control "public,max-age=60" always;
            add_header Vary                       "User-Agent"        always;
        }

        location /vary-encoding/ {
            # Accept-Encoding is the one allowed Vary value.
            add_header X-LiteSpeed-Cache-Control "public,max-age=60" always;
            add_header Vary                       "Accept-Encoding"   always;
        }

        location /strip-cookies/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=60"   always;
            add_header X-LiteSpeed-Vary          "cookie=_ga"           always;
        }

        location /min-uses/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=60" always;
        }

        location /stale-target/ {
            add_header X-LiteSpeed-Cache-Control "public,max-age=300" always;
            add_header X-LiteSpeed-Tag           "stale-test"          always;
        }
    }

    # ───────────────────────────────────────────────────────────────────
    # Public server - real lscache module is wired here.
    # ───────────────────────────────────────────────────────────────────
    server {
        listen 8181;
        server_name localhost;

        # off by default
        location / {
            lscache off;
            root __HTDOCS_ROOT__;
        }

        location /cached/      { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /short/       { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /no-cache/    { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /uncontrolled/{ lscache on; proxy_pass http://127.0.0.1:8189; }
        location /tagged/      { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /vary/        { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /private/     { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /set-cookie/  { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /lsc-cookie/  { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /inline-purge/{ lscache on; proxy_pass http://127.0.0.1:8189; }

        location /vary-other/    { lscache on; proxy_pass http://127.0.0.1:8189; }
        location /vary-encoding/ { lscache on; proxy_pass http://127.0.0.1:8189; }

        location /strip-cookies/ {
            lscache on;
            lscache_strip_cookies _ga _gid;
            proxy_pass http://127.0.0.1:8189;
        }

        location /min-uses/ {
            lscache on;
            lscache_min_uses 3;
            proxy_pass http://127.0.0.1:8189;
        }

        location /debug/ {
            lscache on;
            lscache_debug on;
            proxy_pass http://127.0.0.1:8189/cached/;
        }

        location /stale-target/ { lscache on; proxy_pass http://127.0.0.1:8189; }

        # PURGE handler scope (lscache on means our precontent handler runs).
        location /purge/       { lscache on; proxy_pass http://127.0.0.1:8189; }
    }
}
